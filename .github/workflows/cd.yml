# https://ja.nuxtjs.org/docs/2.x/deployment/github-pages#%E3%83%AA%E3%83%9D%E3%82%B8%E3%83%88%E3%83%AA%E3%81%AB-github-pages-%E3%82%92%E3%83%87%E3%83%97%E3%83%AD%E3%82%A4%E3%81%99%E3%82%8B
name: cd

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cd:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [14]

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup node env
        uses: actions/setup-node@v2.1.2
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: yarn

      - name: Resolve Google Analytics ID
        id: ga
        run: |
          GA_ID="${{ secrets.GOOGLE_ANALYTICS_ID }}"
          if [ -z "$GA_ID" ]; then
            GA_ID=$(node -p "require('./analytics.config.json').id || ''")
          fi
          echo "id=$GA_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$GA_ID" ]; then
            echo "::warning::Google Analytics ID is not set. Set GOOGLE_ANALYTICS_ID secret or analytics.config.json id."
          else
            echo "Google Analytics ID is configured."
          fi

      - name: Generate
        run: yarn run generate
        env:
          GOOGLE_ANALYTICS_ID: ${{ steps.ga.outputs.id }}

      - name: Deploy
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: www.theshibsters.com
