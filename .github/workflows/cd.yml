# https://ja.nuxtjs.org/docs/2.x/deployment/github-pages#%E3%83%AA%E3%83%9D%E3%82%B8%E3%83%88%E3%83%AA%E3%81%AB-github-pages-%E3%82%92%E3%83%87%E3%83%97%E3%83%AD%E3%82%A4%E3%81%99%E3%82%8B
name: cd

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup node env
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 14.21.3
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Shallow checkout mtimes are identical; dates come from frontmatter or git.
      - name: Verify content dates
        run: yarn run verify:dates

      - name: Resolve Google Analytics ID
        id: ga
        run: |
          GA_ID="${{ secrets.GOOGLE_ANALYTICS_ID }}"
          if [ -z "$GA_ID" ]; then
            GA_ID=$(node -p "require('./analytics.config.json').id || ''")
          fi
          echo "id=$GA_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$GA_ID" ]; then
            echo "::warning::Google Analytics ID is not set. Set GOOGLE_ANALYTICS_ID secret or analytics.config.json id."
          else
            echo "Google Analytics ID is configured."
          fi

      - name: Generate
        run: yarn run generate
        env:
          GOOGLE_ANALYTICS_ID: ${{ steps.ga.outputs.id }}

      - name: Verify generated site
        run: node scripts/verify-generated-site.js

      - name: Upload static site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-site
          path: dist
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download static site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: static-site
          path: dist

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: www.theshibsters.com
