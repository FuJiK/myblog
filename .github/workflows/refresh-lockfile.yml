name: Refresh lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.head_ref == 'fix/nuxt-generate-force-build' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 14.21.3

      - name: Regenerate npm dependency graph
        run: |
          rm -rf node_modules package-lock.json
          npm install
          node -p "'nuxt=' + require('nuxt/package.json').version"
          node -p "'vue=' + require('vue/package.json').version"
          node -p "'vue-server-renderer=' + require('vue-server-renderer/package.json').version"

      - name: Verify static generation
        run: npm run generate
        env:
          GOOGLE_ANALYTICS_ID: ''

      - name: Commit verified lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh npm lockfile from verified dependency graph'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
