name: Refresh lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh-lockfile:
    if: github.head_ref == 'fix/nuxt-generate-force-build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 14.21.3

      - name: Regenerate npm dependency graph
        run: |
          rm -rf node_modules package-lock.json
          npm install
          node -p "'nuxt=' + require('nuxt/package.json').version"
          node -p "'vue=' + require('vue/package.json').version"
          node -p "'vue-server-renderer=' + require('vue-server-renderer/package.json').version"

      - name: Verify static generation
        run: npm run generate
        env:
          GOOGLE_ANALYTICS_ID: ''

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
